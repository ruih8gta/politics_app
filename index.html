<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ニッポン政治ダッシュボード</title>
  <meta name="description" content="日本の政治情勢（内閣・国会の勢力図・内閣支持率・政治日程）を一目で把握できるダッシュボード">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>ニッポン政治ダッシュボード</h1>
      <p class="updated">データ更新日：<time id="updated">—</time></p>
      <nav class="site-nav" aria-label="ページ内">
        <a href="#top">概要</a>
        <a href="#houses">国会</a>
        <a href="#h-agenda">政府の重点政策</a>
        <a href="#h-issues">争点と各党</a>
        <a href="#h-cal">日程・閣僚</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="kpis" id="kpis" aria-label="主要指標"><span id="top"></span></section>

    <section class="card" aria-labelledby="h-gov">
      <h2 id="h-gov">政権</h2>
      <div id="government"></div>
    </section>

    <section class="houses" id="houses" aria-label="国会の勢力図"></section>

    <section class="card" aria-labelledby="h-agenda">
      <h2 id="h-agenda">政府の重点政策・国会の主な論点</h2>
      <div class="agenda" id="agenda"></div>
    </section>

    <section class="card" aria-labelledby="h-issues">
      <h2 id="h-issues">争点ごとの各党の立場</h2>
      <p class="note" id="issues-note"></p>
      <div class="issue-tabs" id="issue-tabs" role="tablist" aria-label="争点"></div>
      <div id="issue-detail" role="tabpanel"></div>
      <details class="matrix-wrap">
        <summary>全争点の一覧表を見る</summary>
        <div class="matrix-scroll"><table class="matrix" id="matrix"></table></div>
      </details>
    </section>

    <div class="grid-2">
      <section class="card" aria-labelledby="h-polls">
        <h2 id="h-polls">内閣支持率（直近の世論調査）</h2>
        <div id="polls"></div>
        <p class="note">調査機関・手法により数値に差があります。</p>
      </section>

      <section class="card" aria-labelledby="h-cal">
        <h2 id="h-cal">政治日程</h2>
        <ol class="timeline" id="calendar"></ol>
      </section>
    </div>

    <section class="card" aria-labelledby="h-cab">
      <h2 id="h-cab">主要閣僚</h2>
      <ul class="cabinet" id="cabinet"></ul>
    </section>

    <section class="card sources" aria-labelledby="h-src">
      <h2 id="h-src">出典</h2>
      <ul id="sources"></ul>
      <p class="note">本サイトのデータは手動で更新しています。最新・正確な情報は各出典をご確認ください。</p>
    </section>
  </main>

  <footer class="site-footer"><div class="wrap">politics_app</div></footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
